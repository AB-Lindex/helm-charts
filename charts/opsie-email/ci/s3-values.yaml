image:
  repository: example.invalid/opsie-email
  tag: v0.0.0-test
existingSecret: opsie-email-shared
routes:
  url: http://opsie-internal:8090/api/internal/mail-routes
opsie:
  intakeUrl: http://opsie:80
blob:
  provider: s3
  existingSecret: opsie-email-blob
  s3:
    bucket: opsie-email
    endpoint: http://minio.storage.svc:9000
    pathStyle: true
networkPolicy:
  egress:
    blobPort: 9000
    blobTo:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: storage
