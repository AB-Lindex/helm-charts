{{- $s := .Values.service.smtp }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsie-email.nameWith" (dict "root" . "suffix" "smtp") }}
  labels:
    {{- include "opsie-email.labels" . | nindent 4 }}
    app.kubernetes.io/component: smtp
  {{- with $s.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $s.type }}
  {{- if ne $s.type "ClusterIP" }}
  externalTrafficPolicy: {{ $s.externalTrafficPolicy }}
  {{- end }}
  {{- if and (eq $s.type "LoadBalancer") $s.loadBalancerIP }}
  loadBalancerIP: {{ $s.loadBalancerIP }}
  {{- end }}
  {{- if and (eq $s.type "LoadBalancer") $s.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml $s.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  ports:
    - name: smtp
      port: {{ $s.port | int }}
      targetPort: smtp
      protocol: TCP
  selector:
    {{- include "opsie-email.selectorLabels" . | nindent 4 }}
---
{{- /* The attachment API is cluster-internal; the name matches email.attachments.url of the opsie chart. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsie-email.fullname" . }}
  labels:
    {{- include "opsie-email.labels" . | nindent 4 }}
    app.kubernetes.io/component: attachments
spec:
  type: ClusterIP
  ports:
    - name: attachments
      port: {{ .Values.service.attachments.port | int }}
      targetPort: attachments
      protocol: TCP
  selector:
    {{- include "opsie-email.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsie-email.nameWith" (dict "root" . "suffix" "metrics") }}
  labels:
    {{- include "opsie-email.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.service.metrics.port | int }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "opsie-email.selectorLabels" . | nindent 4 }}
