suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
values:
  - ../ci/azure-workload-identity-values.yaml
tests:
  - it: carries the workload identity annotations
    asserts:
      - equal:
          path: metadata.name
          value: opsie-email
      - equal:
          path: metadata.annotations["azure.workload.identity/client-id"]
          value: 00000000-0000-0000-0000-000000000000

  - it: renders nothing when not created
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
