apiVersion: v2
name: opsie
description: A Helm chart for Opsie, the on-call and alert management platform (external MSSQL or PostgreSQL, Valkey required), with the optional opsie-email SMTP front end

type: application

version: 0.8.1
appVersion: "v0.37"

kubeVersion: ">=1.32.0-0"

home: https://github.com/AB-Lindex/helm-charts
sources:
  - https://github.com/AB-Lindex/helm-charts
  - https://github.com/AB-Lindex/opsie

dependencies:
  - name: valkey
    version: 1.0.0-rc.1
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled
  - name: valkey
    alias: valkeySentinel
    version: 1.0.0-rc.1
    repository: https://valkey.io/valkey-helm/
    condition: valkeySentinel.enabled
