apiVersion: v2
name: opsie
description: A Helm chart for Opsie, the on-call and alert management platform (external MSSQL or PostgreSQL, Valkey required)

type: application

version: 0.2.0
appVersion: "v0.11"

kubeVersion: ">=1.32.0-0"

home: https://github.com/AB-Lindex/helm-charts
sources:
  - https://github.com/AB-Lindex/helm-charts
  - https://github.com/AB-Lindex/opsie

dependencies:
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled
