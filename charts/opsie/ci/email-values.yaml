image:
  repository: example.invalid/opsie
  tag: v0.0.0-test

topology: all-in-one

database:
  existingSecret: opsie-database

auth:
  jwt:
    existingSecret: opsie-jwt

valkey:
  enabled: true
  auth:
    usersExistingSecret: opsie-valkey

metrics:
  serviceMonitor:
    enabled: true

email:
  enabled: true
  domain: mail.example.com
  existingSecret: opsie-email-shared
  attachments:
    url: http://opsie-email:8082
  networkPolicy:
    metricsPeers:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
