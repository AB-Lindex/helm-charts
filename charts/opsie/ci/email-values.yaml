image:
  repository: example.invalid/opsie
  tag: v0.0.0-test

topology: all-in-one

database:
  existingSecret: opsie-database

auth:
  jwt:
    existingSecret: opsie-jwt

valkey:
  enabled: true
  auth:
    usersExistingSecret: opsie-valkey

metrics:
  serviceMonitor:
    enabled: true

email:
  enabled: true
  domain: mail.example.com
  existingSecret: opsie-email-shared
  image:
    repository: example.invalid/opsie-email
    tag: v0.0.0-test
  blob:
    azure:
      container: attachments
      accountUrl: https://account.blob.core.windows.net
  networkPolicy:
    metricsPeers:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
