image:
  repository: example.invalid/opsie
  tag: v0.0.0-test

topology: split-all

database:
  existingSecret: opsie-database
  migrate:
    serviceAccount:
      create: true

auth:
  jwt:
    existingSecret: opsie-jwt
  oidc:
    issuer: https://issuer.example
    existingSecret: opsie-oidc

valkey:
  enabled: true
  auth:
    usersExistingSecret: opsie-valkey

tls:
  mode: native
  existingSecret: opsie-tls

metrics:
  serviceMonitor:
    enabled: true

ingresses:
  - name: users
    className: nginx
    hosts:
      - host: opsie.example

httpRoutes:
  - name: senders
    parentRefs:
      - name: gateway
    hostnames:
      - events.example
