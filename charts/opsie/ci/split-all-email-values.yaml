image:
  repository: example.invalid/opsie
  tag: v0.0.0-test

topology: split-all

database:
  existingSecret: opsie-database

auth:
  jwt:
    existingSecret: opsie-jwt

valkey:
  enabled: true
  auth:
    usersExistingSecret: opsie-valkey

internal:
  port: 9100

email:
  enabled: true
  domain: mail.example.com
  existingSecret: opsie-email-shared
  blob:
    provider: s3
    s3:
      bucket: opsie-email
      region: eu-north-1
  networkPolicy:
    egress:
      enabled: true
