{{- if .Values.email.enabled }}
{{- $e := .Values.email }}
{{- $blob := $e.blob }}
{{- $secret := $e.existingSecret }}
{{- $podLabels := mergeOverwrite (include "opsie.emailSelectorLabels" . | fromYaml) (.Values.podLabels | default dict) ($e.podLabels | default dict) }}
{{- if include "opsie.emailWorkloadIdentity" . }}
{{- $_ := set $podLabels "azure.workload.identity/use" "true" }}
{{- end }}
{{- $podAnnotations := mergeOverwrite (dict) (.Values.podAnnotations | default dict) ($e.podAnnotations | default dict) }}
{{- $spread := include "opsie.topologySpread" (dict "root" . "part" "email" "own" $e.topologySpreadConstraints) }}
{{- $saName := include "opsie.serviceAccountName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsie.emailName" . }}
  labels:
    {{- include "opsie.partLabels" (dict "root" . "part" "email") | nindent 4 }}
spec:
  replicas: {{ $e.replicaCount | int }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- toYaml .Values.strategy.rollingUpdate | nindent 6 }}
  selector:
    matchLabels:
      {{- include "opsie.emailSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- toYaml $podLabels | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $saName }}
      serviceAccountName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $e.terminationGracePeriodSeconds | int }}
      {{- with $e.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: opsie-email
          image: {{ include "opsie.emailImage" . | quote }}
          imagePullPolicy: {{ $e.image.pullPolicy }}
          ports:
            - name: smtp
              containerPort: 2525
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: attachments
              containerPort: 8082
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: SMTP_ADDR
              value: ":2525"
            - name: ATTACHMENT_API_ADDR
              value: ":8082"
            - name: METRICS_ADDR
              value: ":9090"
            - name: LOG_LEVEL
              value: {{ $e.logLevel | quote }}
            - name: ROUTES_SOURCE
              value: {{ printf "http://%s:%d/api/internal/mail-routes" (include "opsie.nameWith" (dict "root" . "suffix" "internal")) (.Values.internal.port | int) | quote }}
            - name: ROUTES_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: routes-token
            - name: ATTACHMENTS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: attachments-secret
            - name: OPSIE_INTAKE_URL
              value: {{ printf "http://%s:80" (include "opsie.partFullname" (dict "root" . "part" (include "opsie.intakePart" .))) | quote }}
            {{- with $e.routes.pollInterval }}
            - name: ROUTES_POLL_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- with $e.routes.maxAge }}
            - name: ROUTES_MAX_AGE
              value: {{ . | quote }}
            {{- end }}
            {{- with $e.forwardTimeout }}
            - name: FORWARD_TIMEOUT
              value: {{ . | quote }}
            {{- end }}
            {{- with $e.smtp.domain }}
            - name: SMTP_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            - name: SMTP_ACCEPT_DOMAINS
              value: {{ join "," (default (list $e.domain) $e.smtp.acceptDomains) | quote }}
            {{- with $e.smtp.maxMessageBytes }}
            - name: SMTP_MAX_MESSAGE_BYTES
              value: {{ ternary . (int64 .) (kindIs "string" .) | toString | quote }}
            {{- end }}
            {{- with $e.smtp.rcptFailMax }}
            - name: SMTP_RCPT_FAIL_MAX
              value: {{ ternary . (int64 .) (kindIs "string" .) | toString | quote }}
            {{- end }}
            {{- with $e.smtp.rcptFailWindow }}
            - name: SMTP_RCPT_FAIL_WINDOW
              value: {{ . | quote }}
            {{- end }}
            - name: BLOB_PROVIDER
              value: {{ $blob.provider | quote }}
            {{- if eq $blob.provider "azure" }}
            - name: BLOB_AZURE_CONTAINER
              value: {{ $blob.azure.container | quote }}
            - name: BLOB_AZURE_AUTH
              value: {{ $blob.azure.auth | quote }}
            {{- if has $blob.azure.auth (list "workload-identity" "sas") }}
            - name: BLOB_AZURE_ACCOUNT_URL
              value: {{ $blob.azure.accountUrl | quote }}
            {{- end }}
            {{- if eq $blob.azure.auth "connection-string" }}
            - name: BLOB_AZURE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ $blob.existingSecret }}
                  key: azure-connection-string
            {{- end }}
            {{- if eq $blob.azure.auth "sas" }}
            - name: BLOB_AZURE_SAS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $blob.existingSecret }}
                  key: azure-sas-token
            {{- end }}
            {{- end }}
            {{- if eq $blob.provider "s3" }}
            - name: BLOB_S3_BUCKET
              value: {{ $blob.s3.bucket | quote }}
            {{- with $blob.s3.region }}
            - name: BLOB_S3_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with $blob.s3.endpoint }}
            - name: BLOB_S3_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: BLOB_S3_PATH_STYLE
              value: {{ $blob.s3.pathStyle | quote }}
            {{- if $blob.existingSecret }}
            - name: BLOB_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $blob.existingSecret }}
                  key: s3-access-key-id
            - name: BLOB_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $blob.existingSecret }}
                  key: s3-secret-access-key
            {{- end }}
            {{- end }}
            {{- if eq $blob.provider "filesystem" }}
            - name: BLOB_FS_ROOT
              value: /data/blobs
            {{- end }}
            {{- with $e.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $e.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $e.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $blob.provider "filesystem" }}
            - name: blobs
              mountPath: /data/blobs
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $blob.provider "filesystem" }}
        - name: blobs
          persistentVolumeClaim:
            claimName: {{ $blob.filesystem.existingClaim }}
        {{- end }}
      {{- with $e.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $e.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $e.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $spread }}
      topologySpreadConstraints:
        {{- $spread | nindent 8 }}
      {{- end }}
{{- end }}
