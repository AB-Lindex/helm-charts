{{- $root := . }}
{{- $checksum := include "opsie.configData" . | sha256sum }}
{{- range $part := (include "opsie.parts" . | fromJsonArray) }}
{{- $p := index $root.Values.parts $part }}
{{- $podLabels := mergeOverwrite (include "opsie.selectorLabels" (dict "root" $root "part" $part) | fromYaml) ($root.Values.podLabels | default dict) ($p.podLabels | default dict) }}
{{- $podAnnotations := mergeOverwrite (dict) ($root.Values.podAnnotations | default dict) ($p.podAnnotations | default dict) (dict "checksum/config" $checksum) }}
{{- $env := include "opsie.partEnv" (dict "root" $root "part" $part) | fromYamlArray }}
{{- $env = concat $env ($root.Values.extraEnv | default list) ($p.extraEnv | default list) }}
{{- $volumes := include "opsie.partVolumes" (dict "root" $root "part" $part) | fromYamlArray }}
{{- $mounts := include "opsie.partVolumeMounts" (dict "root" $root "part" $part) | fromYamlArray }}
{{- $initParts := $root.Values.database.migrate.initContainerParts }}
{{- $spread := include "opsie.topologySpread" (dict "root" $root "part" $part) }}
{{- $saName := include "opsie.serviceAccountName" $root }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsie.partFullname" (dict "root" $root "part" $part) }}
  labels:
    {{- include "opsie.partLabels" (dict "root" $root "part" $part) | nindent 4 }}
  {{- with $p.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ include "opsie.replicas" (dict "root" $root "part" $part) }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- toYaml $root.Values.strategy.rollingUpdate | nindent 6 }}
  selector:
    matchLabels:
      {{- include "opsie.selectorLabels" (dict "root" $root "part" $part) | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      labels:
        {{- toYaml $podLabels | nindent 8 }}
    spec:
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $saName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with $root.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and (include "opsie.migrateMode" (dict "root" $root "mode" "initContainer")) (or (not $initParts) (has $part $initParts)) }}
      initContainers:
        - {{ include "opsie.migrateContainer" $root | nindent 10 | trim }}
      {{- end }}
      containers:
        - name: opsie
          image: {{ include "opsie.image" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if and (include "opsie.partServesTraffic" $part) (eq $root.Values.tls.mode "native") }}
            - name: https
              containerPort: 8443
              protocol: TCP
            {{- end }}
            {{- if $root.Values.metrics.port }}
            - name: metrics
              containerPort: {{ $root.Values.metrics.port | int }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: {{ include "opsie.nameWith" (dict "root" $root "suffix" "config") }}
            {{- with $root.Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- toYaml $env | nindent 12 }}
          {{- with $root.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (default $root.Values.resources $p.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $mounts }}
          volumeMounts:
            {{- toYaml $mounts | nindent 12 }}
          {{- end }}
      {{- if $volumes }}
      volumes:
        {{- toYaml $volumes | nindent 8 }}
      {{- end }}
      {{- with $p.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $spread }}
      topologySpreadConstraints:
        {{- $spread | nindent 8 }}
      {{- end }}
{{- end }}
