{{- $root := . }}
{{- $split := ne .Values.topology "all-in-one" }}
{{- $uiPart := ternary "app" "all" $split }}
{{- range $entry := .Values.httpRoutes }}
{{- $match := dict "path" (dict "type" "PathPrefix" "value" "/") }}
{{- $eventsMatch := dict "path" (dict "type" "PathPrefix" "value" "/api/events") }}
{{- with $entry.matchHeaders }}
{{- $_ := set $match "headers" . }}
{{- $_ := set $eventsMatch "headers" . }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "opsie.nameWith" (dict "root" $root "suffix" $entry.name) }}
  labels:
    {{- include "opsie.labels" $root | nindent 4 }}
  {{- with $entry.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $entry.parentRefs | nindent 4 }}
  {{- with $entry.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if $split }}
    - matches:
        - {{ toYaml $eventsMatch | nindent 10 | trim }}
      {{- with $entry.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "opsie.partFullname" (dict "root" $root "part" "ingest") }}
          port: 80
    {{- end }}
    - matches:
        - {{ toYaml $match | nindent 10 | trim }}
      {{- with $entry.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "opsie.partFullname" (dict "root" $root "part" $uiPart) }}
          port: 80
{{- end }}
