{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opsie.serviceAccountName" . }}
  labels:
    {{- mergeOverwrite (include "opsie.labels" . | fromYaml) (.Values.serviceAccount.labels | default dict) | toYaml | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if not (kindIs "invalid" .Values.serviceAccount.automountServiceAccountToken) }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
