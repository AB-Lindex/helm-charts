suite: oidc redirect url
templates:
  - templates/deployment.yaml
values:
  - ../ci/all-in-one-values.yaml
set:
  auth.oidc.issuer: https://issuer.example
  auth.oidc.existingSecret: opsie-oidc
tests:
  - it: derives from the first Ingress host
    set:
      ingresses:
        - name: a
        - name: b
          hosts:
            - host: first.example
            - host: second.example
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_REDIRECT_URL
            value: https://first.example/api/auth/callback

  - it: derives from the first HTTPRoute hostname when no Ingress has a host
    set:
      ingresses:
        - name: a
      httpRoutes:
        - name: g
          parentRefs:
            - name: gw
          hostnames:
            - route.example
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_REDIRECT_URL
            value: https://route.example/api/auth/callback

  - it: the explicit value wins
    set:
      auth.oidc.redirectUrl: https://explicit.example/cb
      ingresses:
        - name: a
          hosts:
            - host: first.example
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_REDIRECT_URL
            value: https://explicit.example/cb
