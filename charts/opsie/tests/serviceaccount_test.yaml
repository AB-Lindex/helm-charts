suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
values:
  - ../ci/all-in-one-values.yaml
tests:
  - it: defaults to the base name without token settings
    asserts:
      - equal:
          path: metadata.name
          value: opsie
      - notExists:
          path: automountServiceAccountToken

  - it: honours name and annotations
    set:
      serviceAccount.name: custom
      serviceAccount.annotations:
        azure.workload.identity/client-id: abc
    asserts:
      - equal:
          path: metadata.name
          value: custom
      - equal:
          path: metadata.annotations["azure.workload.identity/client-id"]
          value: abc

  - it: renders nothing when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: follows fullnameOverride
    set:
      fullnameOverride: other
    asserts:
      - equal:
          path: metadata.name
          value: other
