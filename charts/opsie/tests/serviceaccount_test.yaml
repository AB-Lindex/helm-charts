suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
values:
  - ../ci/all-in-one-values.yaml
tests:
  - it: defaults to the base name without token settings
    asserts:
      - equal:
          path: metadata.name
          value: opsie
      - notExists:
          path: automountServiceAccountToken

  - it: honours name and annotations
    set:
      serviceAccount.name: custom
      serviceAccount.annotations:
        azure.workload.identity/client-id: abc
    asserts:
      - equal:
          path: metadata.name
          value: custom
      - equal:
          path: metadata.annotations["azure.workload.identity/client-id"]
          value: abc

  - it: adds labels next to the chart labels
    set:
      serviceAccount.labels:
        azure.workload.identity/use: "true"
    asserts:
      - equal:
          path: metadata.labels["azure.workload.identity/use"]
          value: "true"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: opsie

  - it: lets labels override chart labels
    set:
      serviceAccount.labels:
        app.kubernetes.io/managed-by: custom
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: custom

  - it: sets automountServiceAccountToken false
    set:
      serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: sets automountServiceAccountToken true
    set:
      serviceAccount.automountServiceAccountToken: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: renders nothing when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: follows fullnameOverride
    set:
      fullnameOverride: other
    asserts:
      - equal:
          path: metadata.name
          value: other
