suite: servicemonitor
templates:
  - templates/servicemonitor.yaml
values:
  - ../ci/split-all-values.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one ServiceMonitor that scrapes /metrics over http on the http port
    set:
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.interval: 15s
      metrics.serviceMonitor.labels:
        release: prometheus
    release:
      name: opsie
      namespace: apps
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: opsie
      - equal:
          path: metadata.labels.release
          value: prometheus
      - equal:
          path: spec.endpoints
          value:
            - port: http
              path: /metrics
              interval: 15s
              scheme: http
      - equal:
          path: spec.namespaceSelector.matchNames
          value:
            - apps

  - it: scrapes the dedicated metrics port when metrics.port is set
    set:
      metrics.serviceMonitor.enabled: true
      metrics.port: 9090
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: metrics

  - it: scrapes with plain http also under native TLS and sets no TLS or auth
    set:
      metrics.serviceMonitor.enabled: true
      tls.mode: native
      tls.existingSecret: opsie-tls
      tls.httpsRedirect: true
    asserts:
      - equal:
          path: spec.endpoints[0].scheme
          value: http
      - equal:
          path: spec.endpoints[0].port
          value: http
      - notExists:
          path: spec.endpoints[0].tlsConfig
      - notExists:
          path: spec.endpoints[0].basicAuth
      - notExists:
          path: spec.endpoints[0].bearerTokenSecret
      - notExists:
          path: spec.endpoints[0].authorization

  - it: selects the labels every Service of the release carries
    set:
      metrics.serviceMonitor.enabled: true
    release:
      name: opsie
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: opsie
            app.kubernetes.io/instance: opsie
      - equal:
          path: spec.podTargetLabels
          value:
            - app.kubernetes.io/component
