# Default values for the opsie chart.
# Every secret input is an existing Secret referenced by name; the chart never holds a secret value.

# -- Base name of every resource; parts add -ingest, -processor, -app. Empty falls back to <release>-opsie.
fullnameOverride: opsie
# -- Overrides the chart name used in labels and the default full name.
nameOverride: ""

image:
  # -- Placeholder: the public image address is not known yet. Set it in your values file; rendering fails while it is TBD.
  repository: TBD
  # -- Placeholder: set the real version in your values file. Empty falls back to the chart appVersion.
  tag: v0
  # -- Image pull policy for every container.
  pullPolicy: IfNotPresent
  # -- Image pull secrets, a list of { name: ... }.
  pullSecrets: []

# -- Deployment topology: all-in-one | split-ingest | split-all. Changing it after deployment is not tested.
topology: all-in-one

topologySpread:
  # -- Spread every part's pods; on whatever the replica count.
  enabled: true
  # -- Constraints used for every part unless the part sets its own. The chart fills labelSelector with the part's own pods unless one is given.
  constraints:
    - maxSkew: 1
      topologyKey: agentpool
      whenUnsatisfiable: ScheduleAnyway
    # - maxSkew: 1
    #   topologyKey: topology.kubernetes.io/zone
    #   whenUnsatisfiable: ScheduleAnyway
    # - maxSkew: 1
    #   topologyKey: kubernetes.io/hostname
    #   whenUnsatisfiable: ScheduleAnyway

# -- Settings per part. Empty replicaCount means the topology default (all-in-one: 1, split-ingest: 1 per part, split-all: 2 per part).
# Every part accepts: replicaCount, resources, nodeSelector, tolerations, affinity,
# topologySpreadConstraints (replaces topologySpread.constraints for the part), annotations
# (Deployment annotations, for example an Argo CD sync-wave), podLabels, podAnnotations and extraEnv.
# A part that does not exist in the chosen topology must stay empty.
parts:
  all:
    replicaCount: ""
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    annotations: {}
    podLabels: {}
    podAnnotations: {}
    extraEnv: []
  ingest:
    replicaCount: ""
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    annotations: {}
    podLabels: {}
    podAnnotations: {}
    extraEnv: []
  processor:
    replicaCount: ""
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    annotations: {}
    podLabels: {}
    podAnnotations: {}
    extraEnv: []
  app:
    replicaCount: ""
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    annotations: {}
    podLabels: {}
    podAnnotations: {}
    extraEnv: []

# -- Rolling update of every part's Deployment: one pod at a time, never below the replica count.
strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# -- terminationGracePeriodSeconds of every part's pods; the application's own shutdown timeout is 120 s.
terminationGracePeriodSeconds: 130

podDisruptionBudget:
  # -- auto | true | false. auto renders a budget only for parts with 2 or more replicas.
  enabled: auto
  # -- Set only one of maxUnavailable and minAvailable. To use minAvailable set maxUnavailable: null.
  maxUnavailable: 1
  # -- Alternative to maxUnavailable; a number or a percentage.
  minAvailable: null

serviceAccount:
  # -- Create the ServiceAccount used by every part and by opsie-email.
  create: true
  # -- Empty means the base name (opsie).
  name: ""
  # -- Extra labels on the ServiceAccount, for example azure.workload.identity/use. They win over the chart labels.
  labels: {}
  # -- Annotations on the ServiceAccount, for example for workload identity.
  annotations: {}
  # -- automountServiceAccountToken of the ServiceAccount. null leaves it unset (Kubernetes default: true); false is honoured.
  automountServiceAccountToken: null

database:
  # -- mssql | postgres. The memory provider is never offered.
  type: mssql
  # -- Required: name of an existing Secret holding the connection string.
  existingSecret: ""
  # -- Key in the Secret, form sqlserver://user:pass@host:1433?database=opsie
  existingSecretKey: connection-string
  migrate:
    # -- Run mssql-migrate (mssql only).
    enabled: true
    # -- hook | initContainer | none
    mode: hook
    # -- Pass --dry-run: preview without changing the database.
    dryRun: false
    # -- hook mode: Job backoffLimit.
    backoffLimit: 1
    # -- hook mode: Job activeDeadlineSeconds.
    activeDeadlineSeconds: 600
    # -- hook mode: Job ttlSecondsAfterFinished, removes the finished Job and its pod. null keeps them until the next hook run.
    ttlSecondsAfterFinished: 3600
    # -- Resources of the migration container.
    resources: {}
    # -- Extra annotations on the hook Job, for example argocd.argoproj.io/hook: PreSync. They win over the Helm hook annotations.
    annotations: {}
    # -- initContainer mode: which parts run it. Empty means every part.
    initContainerParts: []
    # -- Labels on the migration pod, for example azure.workload.identity/use.
    podLabels: {}
    # -- Annotations on the migration pod.
    podAnnotations: {}
    # -- Extra environment of the migration container.
    extraEnv: []
    serviceAccount:
      # -- true renders a service account as a hook, created before the Job.
      create: false
      # -- Existing account when create is false; empty means the namespace default. <base>-migrate when create is true.
      name: ""
      # -- Extra labels on the migration service account. They win over the chart labels.
      labels: {}
      # -- Annotations on the migration service account.
      annotations: {}

# -- Valkey, standalone (upstream valkey-io/valkey-helm, one pod, no volume). Valkey is required: set exactly one of valkey.enabled, valkeySentinel.enabled and redis.enabled.
# A restart of this pod signs every user out; valkeySentinel.enabled keeps the sessions through a restart.
# Everything not listed here is passed through to the sub-chart.
valkey:
  enabled: false
  # RollingUpdate is safe without a volume and keeps the old pod serving until the new one is ready.
  deploymentStrategy: RollingUpdate
  auth:
    # -- The chart refuses to render with it off; Opsie does not run Valkey without a password.
    enabled: true
    # -- Existing Secret; the key named after the user holds the password (user default: key default).
    usersExistingSecret: opsie-valkey
    aclUsers:
      default:
        permissions: "~* &* +@all"
  # fullnameOverride: opsie-valkey   # pins the Service name when the release is not called opsie

# -- Valkey with replication and Sentinel (the same upstream chart under another alias): three Valkey pods with a small volume each, three Sentinels, a PodDisruptionBudget for each.
# Opsie finds the primary through the Sentinel Service. The Secret needs the keys default, replication-user and sentinel (three different passwords).
# Switching from valkey.enabled to valkeySentinel.enabled needs no other setting. Everything not listed here is passed through to the sub-chart.
valkeySentinel:
  enabled: false
  # The alias would otherwise name every resource after valkeySentinel; this keeps the names of valkey.enabled.
  nameOverride: valkey
  replica:
    enabled: true
    replicas: 3
    replicationUser: replication-user
  sentinel:
    enabled: true
    replicas: 3
    quorum: 2
    downAfterMilliseconds: 5000
    preStopFailover: true
    # Secret holding the Sentinel password under passwordKey.
    existingSecret: opsie-valkey
    passwordKey: sentinel
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # The selector omits the release name: the sub-chart does not template these values. It matches this namespace only.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: valkey-sentinel
  persistence:
    enabled: true
    size: 100Mi
    # Empty uses the cluster's default storage class.
    storageClass: ""
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: valkey
  readinessProbe:
    enabled: true
  haproxy:
    enabled: false
  networkPolicy:
    enabled: false
  metrics:
    enabled: false
  auth:
    enabled: true
    usersExistingSecret: opsie-valkey
    aclUsers:
      default:
        permissions: "~* &* +@all"
      replication-user:
        # Replication and failover, see the sub-chart's sentinel.monitorUser.
        permissions: "~* &* +multi +exec +ping +info +role +subscribe +publish +slaveof +replicaof +config|rewrite +client +failover +script|kill +psync +replconf"
  # fullnameOverride: opsie-valkey   # pins the Service names when the release is not called opsie

# -- External Valkey-compatible service (Valkey or Redis with pub/sub; not Microsoft Garnet), used when neither valkey.enabled nor valkeySentinel.enabled is set.
redis:
  enabled: false
  # -- standalone | sentinel.
  mode: standalone
  # -- host:port of the server. In sentinel mode a comma separated list of Sentinel addresses.
  addr: ""
  # -- Required: existing Secret holding the Valkey password (user default).
  existingSecret: ""
  # -- Key in the Secret.
  existingSecretKey: password
  # -- Key in the same Secret holding the Sentinel password (user sentinel); needed in sentinel mode.
  existingSecretSentinelKey: sentinel

auth:
  jwt:
    # -- Required: existing Secret with keys jwt-secret, jwt-secret-next (optional) and jwt-secret-previous (optional).
    existingSecret: ""
  oidc:
    # -- OIDC issuer URL. Empty disables OIDC settings.
    issuer: ""
    # -- Empty derives https://<first host>/api/auth/callback from ingresses or httpRoutes.
    redirectUrl: ""
    # -- Existing Secret with keys client-id and client-secret.
    existingSecret: ""
    # -- OIDC scopes.
    scopes: openid,profile,email
  # -- SESSION_CACHE_TTL for parts that run api, a duration of at most 30s. Empty leaves the application default (15s; 0 switches the cache off).
  sessionCacheTtl: ""
  # -- SESSION_CACHE_STALE_GRACE for parts that run api, a duration of at most 15s: how long past the TTL a cached session is served while Valkey is unreachable. Empty leaves the application default (15s; 0 disables it).
  sessionCacheStaleGrace: ""
  adminEmail:
    # -- Existing ConfigMap holding the admin email file, mounted at /app/config/admin.
    existingConfigMap: ""
    # -- Key (file name) in the ConfigMap.
    key: admin-emails

tls:
  # -- none | proxy | native. proxy trusts X-Forwarded-Proto from the Ingress or Gateway; native serves TLS from tls.existingSecret.
  mode: none
  # -- kubernetes.io/tls Secret for native mode.
  existingSecret: ""
  # -- Mount path of the certificate in native mode.
  mountPath: /app/tls
  # -- Redirect HTTP to HTTPS (native mode only).
  httpsRedirect: false
  # -- HSTS_MAX_AGE as a duration such as 720h. Empty leaves it unset.
  hstsMaxAge: ""

alerts:
  # -- ALERT_REOPEN_WINDOW; empty leaves the application default.
  reopenWindow: ""
  # -- ALERT_ZOMBIE_THRESHOLD; empty leaves the application default.
  zombieThreshold: ""

rego:
  helpers:
    # -- Existing ConfigMap with Rego helper files (*.rego, packages starting with custom), mounted read-only at rego.helpers.mountPath on every part. Sets REGO_HELPERS_DIR.
    existingConfigMap: ""
    # -- Mount path of the helper ConfigMap, also the value of REGO_HELPERS_DIR.
    mountPath: /etc/opsie/rego-lib
  # -- REGO_EVAL_TIMEOUT, the time limit of one rule evaluation, for example 250ms; empty leaves the application default.
  evalTimeout: ""
  # -- REGO_CACHE_BYTES, the size limit of the compiled script cache in bytes; empty leaves the application default.
  cacheBytes: ""

themes:
  # -- Existing ConfigMap with custom themes, mounted at /app/themes/custom.
  existingConfigMap: ""

shareLinks:
  # -- SHARE_LINKS_ENABLED: alert cards get a Share button and the system can create links to alerts for notifications. Needs a public base URL.
  enabled: false
  # -- PUBLIC_BASE_URL: address of Opsie as seen by users and chat services, scheme and host only. Empty derives https://<first host> from ingresses or httpRoutes.
  publicBaseUrl: ""
  # -- SHARE_LINK_LIFETIME: how long a link works, for example 336h. Empty leaves the application default.
  lifetime: ""

branding:
  # -- ENVIRONMENT_NAME: label such as DEV, QA or PROD, shown as a stamp in the sidebar (at most 16 characters). Empty shows no stamp.
  environmentName: ""
  # -- ENVIRONMENT_COLOR: hex color of the stamp such as "#d97706". Empty uses the theme color.
  environmentColor: ""
  # -- COMPANY_LOGO_URL: logo shown at the bottom of the sidebar, an absolute http(s) URL or a path starting with /. Empty shows no logo.
  companyLogoUrl: ""

internal:
  # -- INTERNAL_PORT: plain-HTTP listener of every part. It serves /metrics unauthenticated and, with email.enabled, the mail route sync. Never routed by ingresses or httpRoutes; keep it cluster-internal.
  port: 8090

metrics:
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor that scrapes every part.
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Metrics path; fixed by the application design.
    path: /metrics
    # -- Labels for the Prometheus instance's serviceMonitorSelector.
    labels: {}

email:
  # -- Enable the email integration: Opsie accepts mail envelopes and the opsie-email Deployment (SMTP front end) is rendered with the release. Needs email.domain, email.existingSecret and the blob settings.
  enabled: false
  # -- EMAIL_DOMAIN: the domain of the recipient addresses alerts+<key>@<domain>. Also the default of email.smtp.acceptDomains.
  domain: ""
  # -- Required: one existing Secret in the namespace of the release. Keys: routes-token (required, at least 32 characters), routes-token-next (optional, rotation) and attachments-secret (required, at least 32 characters).
  existingSecret: ""
  # -- Image of opsie-email. By default it runs from the Opsie image (image.repository and image.tag), which holds the binary /app/opsie-email; the chart then sets the command. Set email.image.repository only to run another image, for example the former standalone opsie-email image (its own entrypoint is used).
  image:
    # -- Empty runs opsie-email from the Opsie image.
    repository: ""
    # -- Tag of the override image; required when email.image.repository is set. Ignored otherwise.
    tag: ""
    # -- Image pull policy of the opsie-email container. Empty uses image.pullPolicy. The pull secrets are image.pullSecrets.
    pullPolicy: ""
  # -- Replicas of opsie-email. Mail is delivered synchronously and kept in memory only while a session runs, so replicas need no coordination.
  replicaCount: 2
  # -- LOG_LEVEL of opsie-email: trace, debug, info, warn or error.
  logLevel: info
  # -- FORWARD_TIMEOUT: shared deadline of blob writes and forward per message. Empty leaves the application default (10s).
  forwardTimeout: ""
  routes:
    # -- ROUTES_POLL_INTERVAL. Empty leaves the application default (60s). The route snapshot URL is derived from the internal Service.
    pollInterval: ""
    # -- ROUTES_MAX_AGE: how long the last snapshot is used while polling fails. Empty leaves the application default (10m).
    maxAge: ""
  smtp:
    # -- SMTP_DOMAIN: host name in the greeting. Empty leaves the application default.
    domain: ""
    # -- SMTP_ACCEPT_DOMAINS: recipient domains accepted before the route table decides. Empty means [email.domain].
    acceptDomains: []
    # -- SMTP_MAX_MESSAGE_BYTES: ceiling for every route. Worst case memory is the connection limit times this value. Empty leaves the application default.
    maxMessageBytes: ""
    # -- SMTP_RCPT_FAIL_MAX. Empty leaves the application default.
    rcptFailMax: ""
    # -- SMTP_RCPT_FAIL_WINDOW. Empty leaves the application default.
    rcptFailWindow: ""
  blob:
    # -- Required: azure | s3 | filesystem. The memory provider is for development only and is not offered by this chart.
    provider: azure
    # -- Existing Secret with the blob credentials. Keys: azure-connection-string (auth connection-string), azure-sas-token (auth sas), s3-access-key-id and s3-secret-access-key (optional: empty uses the default AWS credential chain). Not used with auth workload-identity or the filesystem provider.
    existingSecret: ""
    azure:
      # -- Required: container name (BLOB_AZURE_CONTAINER).
      container: ""
      # -- workload-identity | connection-string | sas. workload-identity needs the annotation azure.workload.identity/client-id on the ServiceAccount of the release (serviceAccount.annotations, or the existing account when serviceAccount.create is false).
      auth: workload-identity
      # -- Account URL, required for workload-identity and sas, for example https://account.blob.core.windows.net.
      accountUrl: ""
    s3:
      # -- Required: bucket name (BLOB_S3_BUCKET).
      bucket: ""
      # -- Region; required without an endpoint.
      region: ""
      # -- Endpoint URL for S3-compatible storage.
      endpoint: ""
      # -- Path-style addressing (BLOB_S3_PATH_STYLE).
      pathStyle: false
    filesystem:
      # -- Required: existing PersistentVolumeClaim, mounted at /data/blobs. More than one replica needs a ReadWriteMany volume.
      existingClaim: ""
  service:
    smtp:
      # -- Public Service <base>-email-smtp that receives mail. LoadBalancer | NodePort | ClusterIP.
      type: LoadBalancer
      # -- Service port; the container listens on 2525.
      port: 25
      # -- Local keeps the client address, which route allowedRanges depend on. Ignored for ClusterIP.
      externalTrafficPolicy: Local
      # -- Static public IP of the load balancer.
      loadBalancerIP: ""
      # -- Source ranges allowed to reach the load balancer. Empty allows everyone.
      loadBalancerSourceRanges: []
      # -- Annotations, for example on AKS service.beta.kubernetes.io/azure-pip-name and service.beta.kubernetes.io/azure-load-balancer-resource-group.
      annotations: {}
    attachments:
      # -- Port of the cluster-internal attachment API Service <base>-email (ClusterIP). Opsie reaches it at http://<base>-email:<port>.
      port: 8082
    metrics:
      # -- Port of the cluster-internal metrics Service <base>-email-metrics (ClusterIP).
      port: 9090
  networkPolicy:
    # -- Render the NetworkPolicies of the integration: the internal port of Opsie is limited to opsie-email and metricsPeers, and opsie-email gets an ingress and an egress policy. Needs a CNI that enforces NetworkPolicy.
    enabled: true
    # -- Peers (NetworkPolicy "from" entries, for example the Prometheus pods or namespace) that may scrape /metrics of Opsie (internal port) and of opsie-email. Required when the ServiceMonitor and the policy are both enabled.
    metricsPeers: []
    egress:
      # -- Also render an Egress policy that lets Opsie reach the opsie-email attachment API. An Egress policy isolates all other egress of the pods; combine it with your own egress rules.
      enabled: false
    emailEgress:
      # -- Peers of the blob endpoint, for the egress policy of the opsie-email pods. A NetworkPolicy cannot match host names; narrow the default to the CIDRs of your storage account or the in-cluster object store.
      blobTo:
        - ipBlock:
            cidr: 0.0.0.0/0
      # -- Port of the blob endpoint.
      blobPort: 443
      # -- Peers of login.microsoftonline.com (workload identity only). Same limit as blobTo.
      entraTo:
        - ipBlock:
            cidr: 0.0.0.0/0
  # -- Labels on the opsie-email pods, in addition to podLabels.
  podLabels: {}
  # -- Annotations on the opsie-email pods, in addition to podAnnotations.
  podAnnotations: {}
  # -- Extra environment variables of the opsie-email container.
  extraEnv: []
  # -- Pod security context of opsie-email (its image runs as uid 65532).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  # -- Container security context of opsie-email. The image holds a single static binary, so the root file system is read-only.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  # -- Seconds to finish in-flight sessions; opsie-email drains for 30 s.
  terminationGracePeriodSeconds: 45
  # -- Resources of opsie-email.
  resources: {}
  # -- Node selector of opsie-email.
  nodeSelector: {}
  # -- Tolerations of opsie-email.
  tolerations: []
  # -- Affinity of opsie-email.
  affinity: {}
  # -- Topology spread constraints of opsie-email; empty uses topologySpread.constraints (when topologySpread.enabled).
  topologySpreadConstraints: []

sse:
  # -- Serve the Server-Sent Events stream GET /api/stream, with a dedicated Ingress or HTTPRoute per routing entry. false sets SSE_DISABLED=true and renders no stream routing.
  enabled: true
  # -- SSE_MAX_CONNECTIONS_PER_USER: open streams per user and pod; the oldest is evicted above it. Empty leaves the application default.
  maxConnectionsPerUser: ""
  # -- SSE_MAX_CONNECTIONS: open streams per pod; new requests get 429 above it. Empty leaves the application default.
  maxConnections: ""
  ingress:
    # -- Annotations of the dedicated stream Ingress of every ingresses entry; they win over the entry's own annotations. The defaults target ingress-nginx and must be replaced for another controller.
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
  httpRoute:
    # -- Timeouts of the stream rule of every httpRoutes entry (Gateway API 1.1 or newer). An empty map renders none.
    timeouts:
      request: 3600s

alertEvents:
  # -- Alert change notifications on the SSE stream (alerts appear in open tabs within seconds). false sets ALERT_EVENTS_DISABLED=true on every part; the 30 s poll then covers everything. Needs Valkey, which the chart already requires.
  enabled: true

# -- Labels on the pods of every part and of opsie-email.
podLabels: {}
# -- Annotations on the pods of every part and of opsie-email.
podAnnotations: {}
# -- Extra environment variables on every part.
extraEnv: []
# -- Extra envFrom sources on every part.
extraEnvFrom: []

# -- Default resources of every part; a part's own resources replace them.
resources: {}
# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault
# -- Container security context.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- External routing as Ingress objects. Any number of entries.
ingresses: []
  # - name: users              # required, unique; resource is <base>-users
  #   className: nginx
  #   annotations: {}
  #   hosts:                   # the chart adds the /api/events rule itself in split topologies
  #     - host: opsie.example.com
  #       paths:               # empty means / with pathType Prefix
  #         - path: /
  #           pathType: Prefix
  #   tls: []

# -- External routing as Gateway API HTTPRoute objects. Any number of entries.
httpRoutes: []
  # - name: users              # required, unique; resource is <base>-users
  #   annotations: {}
  #   parentRefs:              # required: the Gateway (and optional listener) to attach to
  #     - name: gateway
  #       namespace: gateway-system
  #   hostnames:
  #     - opsie.example.com
  #   filters: []              # copied into every generated rule
  #   matchHeaders: []         # merged into every generated match, for example [{name: X-Env, value: prod}]

# -- Extra manifests rendered with the release; strings and maps are both passed through tpl.
# The commented Secrets are examples of what the chart expects when the existingSecret values are set.
# Do not keep real secret values in a values file: use a SealedSecret, an ExternalSecret or create the Secrets by hand.
extraObjects: []
  # - apiVersion: v1
  #   kind: Secret
  #   metadata:
  #     name: opsie-database               # database.existingSecret
  #     annotations:                        # needed in hook mode on a first install: the hook runs before other resources exist
  #       helm.sh/hook: pre-install,pre-upgrade
  #       helm.sh/hook-weight: "-10"
  #   type: Opaque
  #   stringData:
  #     connection-string: sqlserver://opsie:CHANGE-ME@mssql.example:1433?database=opsie   # database.existingSecretKey
  # - apiVersion: v1
  #   kind: Secret
  #   metadata:
  #     name: opsie-jwt                    # auth.jwt.existingSecret
  #   type: Opaque
  #   stringData:
  #     jwt-secret: CHANGE-ME-at-least-32-characters
  #     jwt-secret-next: ""                # optional, rotation
  #     jwt-secret-previous: ""            # optional, rotation
  # - apiVersion: v1
  #   kind: Secret
  #   metadata:
  #     name: opsie-oidc                   # auth.oidc.existingSecret
  #   type: Opaque
  #   stringData:
  #     client-id: CHANGE-ME
  #     client-secret: CHANGE-ME
  # - apiVersion: v1
  #   kind: Secret
  #   metadata:
  #     name: opsie-valkey                 # valkey.auth.usersExistingSecret or valkeySentinel.auth.usersExistingSecret (sub-chart); the key is the ACL user name
  #   type: Opaque
  #   stringData:
  #     default: CHANGE-ME
  #     replication-user: CHANGE-ME-too    # valkeySentinel only; a different password
  #     sentinel: CHANGE-ME-as-well        # valkeySentinel only: the Sentinel password, again different
  # - apiVersion: v1
  #   kind: Secret
  #   metadata:
  #     name: opsie-redis                  # redis.existingSecret (external Redis/Valkey)
  #   type: Opaque
  #   stringData:
  #     password: CHANGE-ME                # redis.existingSecretKey
  # - apiVersion: v1
  #   kind: Secret
  #   metadata:
  #     name: opsie-email-shared           # email.existingSecret, read by Opsie and by the opsie-email Deployment
  #   type: Opaque
  #   stringData:
  #     routes-token: CHANGE-ME-at-least-32-characters
  #     routes-token-next: ""              # optional, rotation
  #     attachments-secret: CHANGE-ME-at-least-32-characters
